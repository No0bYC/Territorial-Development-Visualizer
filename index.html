<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TDV — Mapping territorial de Maurice</title>
<meta name="description" content="TDV — carte interactive 3D de Maurice pour lire les dynamiques territoriales et immobilières.">
<meta name="theme-color" content="#FFFFFF">
<!-- PWA / iPhone -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TDV">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Carte -->
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="map"></div>

<!-- Splash -->
<div id="splash">
  <div class="logo">
    <svg class="mark" viewBox="0 0 86 86" aria-hidden="true">
      <g>
        <path class="bar b1" d="M6 78 L6 52 L20 45 L34 52 L34 78 L20 85 Z" fill="#0B0B0C"/>
        <path class="bar b1" d="M6 52 L20 45 L34 52 L20 59 Z" fill="#3A3A3D"/>
        <path class="bar b2" d="M28 70 L28 30 L42 23 L56 30 L56 70 L42 77 Z" fill="#0B0B0C"/>
        <path class="bar b2" d="M28 30 L42 23 L56 30 L42 37 Z" fill="#5A5A5E"/>
        <path class="bar b3" d="M50 62 L50 14 L64 7 L78 14 L78 62 L64 69 Z" fill="#0B0B0C"/>
        <path class="bar b3" d="M50 14 L64 7 L78 14 L64 21 Z" fill="#7A7A7F"/>
      </g>
      <g class="pin"><circle cx="64" cy="0" r="6" fill="#FF2D2D"/></g>
    </svg>
    <div class="word"><i>T</i><i>D</i><i class="v">V</i></div>
  </div>
  <div class="tag">Mapping de gestion territoriale · Maurice</div>
  <div class="stripes" id="stripes"></div>
  <button id="enter" disabled>Explorer la carte <span>→</span></button>
  <div id="loading">Chargement des données…</div>
  <div class="proto">Version 0.3 · population réelle (recensement 2022)</div>
</div>

<!-- Top -->
<div id="top">
  <div class="brand card">
    <svg width="26" height="26" viewBox="0 0 86 86"><path d="M6 78 L6 52 L20 45 L34 52 L34 78 L20 85 Z M28 70 L28 30 L42 23 L56 30 L56 70 L42 77 Z M50 62 L50 14 L64 7 L78 14 L78 62 L64 69 Z" fill="#0B0B0C"/><circle cx="64" cy="0" r="7" fill="#FF2D2D"/></svg>
    <b>TDV</b><small>Mapping territorial · Maurice</small>
  </div>
  <div class="badge">DONNÉES FACTICES</div>
</div>
<div id="views"></div>

<!-- Controls -->
<div id="ctrls">
  <div class="cgroup card">
    <button class="cbtn" id="zin" title="Zoomer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="cbtn" id="zout" title="Dézoomer"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="cgroup card">
    <button class="cbtn" id="rl" title="Pivoter à gauche"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="cbtn" id="rr" title="Pivoter à droite"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
    <button class="cbtn" id="compass" title="Réorienter au nord"><svg viewBox="0 0 24 24"><path d="M12 3l4 9h-8z" fill="#FF2D2D" stroke="#FF2D2D"/><path d="M12 21l-4-9h8z"/></svg></button>
  </div>
  <div class="cgroup card">
    <button class="cbtn on" id="tilt" title="Vue 2D / 3D"><span class="tilt-lbl">3D</span></button>
    <button class="cbtn" id="spin" title="Rotation automatique"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>
</div>

<!-- Panel -->
<div id="panel" class="card">
  <div class="handle"></div>
  <div class="ph" id="ph"><div><h2>Couches de données</h2><div class="count" id="count"></div></div><button class="reset" id="reset">Tout masquer</button></div>
  <div id="actives"></div>
  <div id="layers"></div>
</div>

<!-- Info -->
<div id="info" class="card"><button class="x" id="ix">✕</button><div id="ib"></div></div>

<script src="/vendor/maplibre-gl.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
